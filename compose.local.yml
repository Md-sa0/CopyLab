services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copy}
      POSTGRES_USER: ${POSTGRES_USER:-copy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copy_local}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory
      256mb --maxmemory-policy noeviction
    volumes:
    - redis_data:/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copy}:${POSTGRES_PASSWORD:-copy_local}@postgres:5432/${POSTGRES_DB:-copy}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local}@redis:6379/0
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      PROMPT_VERSION: ${PROMPT_VERSION:-retail-v3}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-90}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    networks:
    - data
    - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',
        timeout=5)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  frontend:
    build:
      context: ./frontend
      target: build
    command:
    - npm
    - run
    - dev
    - --
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --strictPort
    environment:
      API_PROXY_TARGET: http://api:8000
      APP_PUBLIC_SCHEME: http
    restart: unless-stopped
    ports:
    - 127.0.0.1:8080:8080
    volumes:
    - frontend_node_modules:/app/node_modules
    networks:
    - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'require(''http'').get(''http://127.0.0.1:8080/'', r => process.exit(r.statusCode
        === 200 ? 0 : 1)).on(''error'', () => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data: null
  redis_data: null
  frontend_node_modules: null
networks:
  data:
    internal: true
  edge: null
